privacy_1: "<u><b>Политика конфиденциальности ⌯</b></u>\n\n<b>Добро пожаловать в Kavya Music.</b>\n\nВаша конфиденциальность важна для нас. В этой политике объясняется, как бот Telegram и связанные сервисы собирают, используют и защищают вашу информацию.\n\n<b>1. Какие данные мы собираем</b>\n\nМы можем собирать ограниченные данные: Telegram ID, имя пользователя и сведения профиля, сообщения и команды, отправленные боту, а также данные об использовании (например, команды и воспроизводимая музыка).\n\n<b>2. Как мы используем информацию</b>\n\nСобранные данные используются только для предоставления и улучшения функций бота, обработки команд и музыкальных запросов, предотвращения злоупотреблений и обеспечения безопасности, а также ведения журналов для отладки и повышения производительности.\n\n<b>3. Хранение данных</b>\n\n— Мы не храним личные переписки постоянно.\n— Некоторые данные могут временно сохраняться для работы функций бота (например, плейлистов и очередей).\n— Мы не продаём и не передаём ваши данные третьим лицам.\n\n<b>4. Сторонние сервисы</b>\n\nБот может использовать сторонние сервисы: API YouTube и Spotify для музыкальных трансляций, а также Telegram API для работы бота.\n\n<b>5. Безопасность</b>\n\nМы принимаем разумные меры для защиты ваших данных, однако ни один способ передачи информации через интернет не является полностью безопасным.\n\n<b>6. Контроль пользователя</b>\n\nВы можете прекратить пользоваться ботом в любое время, чтобы остановить дальнейший сбор данных.\n\n<b>7. Изменения политики</b>\n\nМы можем время от времени обновлять эту политику. Продолжая пользоваться ботом, вы принимаете обновлённую политику.\n\n<b>8. Контакты</b>\n\nЕсли у вас есть вопросы, свяжитесь с разработчиком или администратором бота.\n\n---\n<b>Используя Kavya Music, вы соглашаетесь с этой политикой конфиденциальности.</b>"
